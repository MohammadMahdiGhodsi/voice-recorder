<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Recording</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">

    <!-- تنظیمات PWA -->
    <link rel="manifest" href="{% static 'manifest.json' %}">
    <meta name="theme-color" content="#ff3b30">
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register("{% static 'sw.js' %}")
                    .then(reg => console.log('Service Worker registered!', reg))
                    .catch(err => console.log('Service Worker registration failed:', err));
            });
        }
    </script>
</head>
<body>
<header>
    <h1>Audio Recording</h1>
</header>

<main>
    <div class="record-area">
        <button id="recordBtn" class="record-btn" aria-label="Audio Recording">
            <span class="mic-icon">🎤</span>
        </button>
        <div id="waveform" class="waveform"></div>
        <p id="status" class="status">Press the button tp record</p>
    </div>

    <section class="sounds-section">
        <h2>Voices</h2>
        <ul id="soundList" class="sound-list"></ul>
        <p id="emptyMsg" class="empty-msg">You haven't recorded any audio yet</p>
    </section>
</main>

<script src="{% static 'js/app.js' %}"></script>
</body>
</html>
